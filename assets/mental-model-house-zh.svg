<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Source Han Sans SC',sans-serif">
