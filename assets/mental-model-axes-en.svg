<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Source Han Sans SC',sans-serif">
  <title>Two axes: building on X, reliability on Y — the real work is moving from impressive demos to systems you can trust</title>
  <defs>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#a65338" opacity="0.10"/>
    </pattern>
    <marker id="arrowhead" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a65338"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="878" height="468" rx="14" fill="#faf7f2" stroke="#a65338" stroke-opacity="0.25"/>
  <text x="28" y="40" fill="#a65338" font-size="15">$ cat mental-model/axes</text>
  <rect x="243" y="27" width="9" height="17" fill="#a65338">
  </rect>

  <rect x="150" y="70" width="670" height="320" fill="url(#dots)"/>

  <line x1="485" y1="84" x2="485" y2="386" stroke="#a65338" stroke-width="1" stroke-dasharray="4 7" opacity="0.18"/>
  <line x1="154" y1="232" x2="812" y2="232" stroke="#a65338" stroke-width="1" stroke-dasharray="4 7" opacity="0.18"/>

  <line x1="150" y1="390" x2="812" y2="390" stroke="#a65338" stroke-width="2"/>
  <polygon points="822,390 806,383 806,397" fill="#a65338"/>
  <line x1="150" y1="390" x2="150" y2="78" stroke="#a65338" stroke-width="2"/>
  <polygon points="150,68 143,84 157,84" fill="#a65338"/>

  <text x="168" y="92" fill="#a65338" font-size="15" font-weight="700">AXIS 2 · RELIABILITY</text>
  <text x="168" y="112" fill="#62584f" font-size="12.5">evals · production feedback · domain correctness</text>
  <text x="812" y="420" text-anchor="end" fill="#a65338" font-size="15" font-weight="700">AXIS 1 · BUILDING</text>
  <text x="812" y="440" text-anchor="end" fill="#62584f" font-size="12.5">principles × orchestration × AI pair-coding</text>

  <text x="250" y="170" fill="#62584f" font-size="13.5" font-style="italic" opacity="0.85">over-tested toys</text>
  <text x="250" y="320" fill="#62584f" font-size="13.5" font-style="italic" opacity="0.85">nothing works</text>

  <circle cx="560" cy="322" r="5.5" fill="#faf7f2" stroke="#795548" stroke-width="2"/>
  <text x="578" y="327" fill="#62584f" font-size="13.5">impressive demos</text>

  <circle cx="716" cy="142" r="6" fill="#a65338"/>
  <circle cx="716" cy="142" r="6" fill="none" stroke="#a65338" stroke-width="2">
  </circle>
  <text x="700" y="130" text-anchor="end" fill="#a65338" font-size="14.5" font-weight="700">systems you can trust</text>

  <path d="M 572,314 Q 668,268 710,156" fill="none" stroke="#a65338" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrowhead)">
  </path>
  <text x="678" y="252" fill="#a65338" font-size="13.5" font-style="italic">the work</text>
</svg>
