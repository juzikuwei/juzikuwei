<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Source Han Sans SC',sans-serif">
  <title>House metaphor: engineering principles are the foundation, LangGraph is the scaffolding, your own code is the interior</title>
  <defs>
