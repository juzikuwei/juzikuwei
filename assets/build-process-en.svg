<text x="36" y="44" fill="#b75d40" font-family="Consolas,monospace" font-size="13" letter-spacing="2">THE HUMAN IN THE LOOP</text><text x="35" y="94" fill="#332b27" font-family="Georgia,Times New Roman,serif" font-size="39" font-style="italic">AI writes. I verify.</text><text x="38" y="153" fill="#b75d40" font-family="Consolas,monospace" font-size="14" >01</text><text x="78" y="154" fill="#332b27" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="22" >Define</text><text x="38" y="190" fill="#77665a" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="17" >Goals, scope, boundaries</text><path d="M283 147h38m-7-5 7 5-7 5" stroke="#b75d40" fill="none"/><text x="364" y="153" fill="#b75d40" font-family="Consolas,monospace" font-size="14" >02</text><text x="404" y="154" fill="#332b27" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="22" >Design</text><text x="364" y="190" fill="#77665a" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="17" >Data, tools, failure paths</text><path d="M609 147h38m-7-5 7 5-7 5" stroke="#b75d40" fill="none"/><text x="690" y="153" fill="#b75d40" font-family="Consolas,monospace" font-size="14" >03</text><text x="730" y="154" fill="#332b27" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="22" >Verify</text><text x="690" y="190" fill="#77665a" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="17" >Tests, evaluations, traces</text>
